name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install --yes clang
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: alaco-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: alaco-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: alaco-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: alaco-windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="${{ matrix.artifact }}-${version}"
          mkdir -p "$package/std"
          cp "target/${{ matrix.target }}/release/alaco" "$package/alaco"
          cp -R std/. "$package/std/"
          cat > "$package/INSTALL.txt" <<'EOF'
          Alaco binary distribution

          Run ./alaco --help to see available commands.
          The std/ directory contains the standard library. Set ALACO_STDLIB_DIR
          to its absolute path, or copy std/ to ~/.alaco/stdlib.
          Building Alaco programs also requires clang++ and the platform's native
          development libraries for any imported modules.
          EOF
          tar -czf "${package}.tar.gz" "$package"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $package = "${{ matrix.artifact }}-$version"
          New-Item -ItemType Directory -Force "$package/std" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/alaco.exe" "$package/alaco.exe"
          Copy-Item "std/*" "$package/std" -Recurse
          @'
          Alaco binary distribution

          Run .\alaco.exe --help to see available commands.
          The std\ directory contains the standard library. Set ALACO_STDLIB_DIR
          to its absolute path, or copy std\ to %USERPROFILE%\.alaco\stdlib.
          Building Alaco programs also requires clang++ and the platform's native
          development tools for any imported modules.
          '@ | Set-Content "$package/INSTALL.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Alaco ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
