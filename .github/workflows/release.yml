name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install --yes clang
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix archives
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          binary="alaco-${version}-${target}-binary"
          bundle="alaco-${version}-${target}"
          mkdir -p "$binary" "$bundle/std"
          cp "target/${target}/release/alaco" "$binary/alaco"
          cp "target/${target}/release/alaco" "$bundle/alaco"
          cp -R std/std/. "$bundle/std/"
          cat > "$binary/INSTALL.txt" <<'EOF'
          Alaco binary-only distribution
          Requires clang++ to compile Alaco programs. Install the standard library
          separately, then set ALACO_STDLIB_DIR to its installation directory.
          EOF
          cat > "$bundle/INSTALL.txt" <<'EOF'
          Alaco combined distribution
          The std/ directory contains the Alaco standard library. Set ALACO_STDLIB_DIR
          to the absolute path of this distribution directory, or install std/ under
          ~/.alaco/stdlib/std. Building Alaco programs also requires clang++.
          EOF
          tar -czf "${binary}.tar.gz" -C "$binary" alaco INSTALL.txt
          tar -czf "${bundle}.tar.gz" -C "$bundle" alaco std INSTALL.txt
      - name: Package Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $target = "${{ matrix.target }}"
          $binary = "alaco-$version-$target-binary"
          $bundle = "alaco-$version-$target"
          New-Item -ItemType Directory -Force $binary, "$bundle/std" | Out-Null
          Copy-Item "target/$target/release/alaco.exe" "$binary/alaco.exe"
          Copy-Item "target/$target/release/alaco.exe" "$bundle/alaco.exe"
          Copy-Item "std/std/*" "$bundle/std" -Recurse
          @'
          Alaco binary-only distribution
          Requires clang++ to compile Alaco programs. Install the standard library
          separately, then set ALACO_STDLIB_DIR to its installation directory.
          '@ | Set-Content "$binary/INSTALL.txt"
          @'
          Alaco combined distribution
          The std\ directory contains the Alaco standard library. Set ALACO_STDLIB_DIR
          to the absolute path of this distribution directory, or install std\ under
          %USERPROFILE%\.alaco\stdlib\std. Building Alaco programs also requires clang++.
          '@ | Set-Content "$bundle/INSTALL.txt"
          tar.exe -czf "$binary.tar.gz" -C $binary alaco.exe INSTALL.txt
          tar.exe -czf "$bundle.tar.gz" -C $bundle alaco.exe std INSTALL.txt
      - name: Upload platform archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: alaco-*-${{ matrix.target }}*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release and AlacoUp Manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package standard library
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="alaco-${version}-stdlib"
          mkdir -p "$package/std"
          cp -R std/std/. "$package/std/"
          cat > "$package/INSTALL.txt" <<'EOF'
          Alaco standard-library-only distribution
          Extract this archive and set ALACO_STDLIB_DIR to the extracted directory.
          To use the default per-user location, copy the std/ directory to
          ~/.alaco/stdlib/std (or %USERPROFILE%\.alaco\stdlib\std on Windows).
          EOF
          tar -czf "release-assets/${package}.tar.gz" -C "$package" std INSTALL.txt
      - name: Generate checksums and AlacoUp manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          python3 ../scripts/generate-release-manifest.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Alaco ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
